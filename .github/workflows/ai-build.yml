name: Auto Generate Site from Gemini

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai

      - name: Generate HTML with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "
          const { GoogleGenerativeAI } = require('@google/generative-ai');
          const fs = require('fs');

          async function run() {
            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: 'gemini-1.5-flash' });
            
            const prompt = 'یک صفحه هوم‌پیج مدرن و شیک با HTML و Tailwind CSS بساز. شامل هدر، بنر اصلی، بخش خدمات و فوتر باشد.';
            const result = await model.generateContent(prompt);
            const response = await result.response;
            let code = response.text().replace(/```html/g, '').replace(/```/g, '').trim();
            
            fs.writeFileSync('index.html', code);
          }
          run();
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🤖 Auto-generated index.html via Gemini" || exit 0
          git push
