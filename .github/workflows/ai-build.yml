name: Auto Generate Site from Gemini

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install @google/genai

      - name: Generate HTML with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "
          const { GoogleGenAI } = require('@google/genai');
          const fs = require('fs');

          async function run() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            const response = await ai.models.generateContent({
              model: 'gemini-2.5-flash',
              contents: 'یک صفحه هوم‌پیج مدرن و شیک با HTML و Tailwind CSS بساز. شامل هدر، بنر اصلی، بخش خدمات و فوتر باشد.',
            });
            let code = response.text.replace(/```html/g, '').replace(/```/g, '').trim();
            fs.writeFileSync('index.html', code);
          }
          run();
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🤖 Auto-generated index.html via Gemini" || exit 0
          git push
