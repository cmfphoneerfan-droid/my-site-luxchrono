name: Auto Generate Site from Gemini

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate HTML via API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > generate.js
          const fs = require('fs');

          async function run() {
            try {
              const apiKey = process.env.GEMINI_API_KEY;
              if (!apiKey) {
                throw new Error("GEMINI_API_KEY is missing in Secrets!");
              }

              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: "یک صفحه هوم‌پيج مدرن و شیک با HTML و Tailwind CSS بساز. فقط کد HTML بده بدون هیچ توضیحی." }] }]
                })
              });

              const data = await response.json();

              if (!data.candidates || !data.candidates[0]) {
                console.error("API Error Response:", JSON.stringify(data, null, 2));
                process.exit(1);
              }

              let text = data.candidates[0].content.parts[0].text;
              text = text.replace(/```html/g, '').replace(/```/g, '').trim();
              fs.writeFileSync('index.html', text);
              console.log('Success! index.html created.');
            } catch (err) {
              console.error('Execution Error:', err);
              process.exit(1);
            }
          }

          run();
          EOF
          node generate.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🤖 Auto-generated index.html via Gemini" || exit 0
          git push
